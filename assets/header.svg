<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="200" style="z-index:1;position:relative" viewBox="0 0 854 200">
  <defs>
    <!-- Black background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    
    <!-- Darker cyan stroke gradient -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008fb3"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </linearGradient>
    
    <!-- Shooting star gradient -->
    <linearGradient id="shootingStar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    
    <!-- Subtle glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      .name {
        font-size: 60px;
        font-weight: 700;
        font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
        fill: #ffffff;
        stroke: url(#neon);
        stroke-width: 1.5;
        paint-order: stroke fill;
      }
      .website {
        font-size: 14px;
        font-weight: 400;
        font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
        fill: rgba(255,255,255,0.6);
        letter-spacing: 0.5px;
      }
      .name, .website, .star {
        animation: fadeIn 1.2s ease-in-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .star {
        animation: twinkle var(--duration) ease-in-out infinite;
        animation-delay: var(--delay);
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .shooting-star {
        animation: shoot var(--duration) linear infinite;
        animation-delay: var(--delay);
        opacity: 0;
      }
      @keyframes shoot {
        0% {
          transform: translateX(-100px) translateY(100px);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateX(954px) translateY(-100px);
          opacity: 0;
        }
      }
    </style>
  </defs>
  
  <!-- Black background -->
  <rect width="854" height="200" fill="url(#bg)"/>
  
  <!-- Twinkling white stars -->
  <circle class="star" cx="50" cy="30" r="1.2" fill="#ffffff" style="--duration: 3s; --delay: 0s"/>
  <circle class="star" cx="120" cy="70" r="1" fill="#ffffff" style="--duration: 4s; --delay: 0.5s"/>
  <circle class="star" cx="200" cy="45" r="1" fill="#ffffff" style="--duration: 2.5s; --delay: 1s"/>
  <circle class="star" cx="280" cy="110" r="1" fill="#ffffff" style="--duration: 3.5s; --delay: 1.5s"/>
  <circle class="star" cx="350" cy="55" r="1" fill="#ffffff" style="--duration: 4s; --delay: 0.3s"/>
  <circle class="star" cx="420" cy="140" r="1" fill="#ffffff" style="--duration: 3s; --delay: 2s"/>
  <circle class="star" cx="500" cy="65" r="1" fill="#ffffff" style="--duration: 2.8s; --delay: 0.8s"/>
  <circle class="star" cx="580" cy="100" r="1" fill="#ffffff" style="--duration: 3.2s; --delay: 1.2s"/>
  <circle class="star" cx="650" cy="40" r="1.2" fill="#ffffff" style="--duration: 4s; --delay: 0s"/>
  <circle class="star" cx="720" cy="85" r="1" fill="#ffffff" style="--duration: 3s; --delay: 1.8s"/>
  <circle class="star" cx="780" cy="150" r="1" fill="#ffffff" style="--duration: 2.5s; --delay: 0.5s"/>
  <circle class="star" cx="100" cy="170" r="1" fill="#ffffff" style="--duration: 3.8s; --delay: 2.2s"/>
  <circle class="star" cx="180" cy="25" r="1" fill="#ffffff" style="--duration: 3s; --delay: 1s"/>
  <circle class="star" cx="320" cy="180" r="1" fill="#ffffff" style="--duration: 4s; --delay: 0.7s"/>
  <circle class="star" cx="450" cy="35" r="1" fill="#ffffff" style="--duration: 2.7s; --delay: 1.5s"/>
  <circle class="star" cx="550" cy="190" r="1" fill="#ffffff" style="--duration: 3.5s; --delay: 0.2s"/>
  <circle class="star" cx="680" cy="75" r="1" fill="#ffffff" style="--duration: 3s; --delay: 1.3s"/>
  <circle class="star" cx="800" cy="50" r="1" fill="#ffffff" style="--duration: 4s; --delay: 2s"/>
  
  <!-- Shooting Stars -->
  <g class="shooting-star" style="--duration: 8s; --delay: 0s">
    <line x1="0" y1="0" x2="-60" y2="30" stroke="url(#shootingStar)" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" filter="url(#glow)"/>
  </g>
  
  <g class="shooting-star" style="--duration: 10s; --delay: 2s">
    <line x1="0" y1="0" x2="-80" y2="40" stroke="url(#shootingStar)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="1.2" fill="#ffffff" filter="url(#glow)"/>
  </g>
  
  <g class="shooting-star" style="--duration: 12s; --delay: 3s">
    <line x1="0" y1="0" x2="-100" y2="50" stroke="url(#shootingStar)" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" filter="url(#glow)"/>
  </g>



    

    
  
  <!-- Animated morphing blob (centered) -->
  <g transform="translate(427, 100)" opacity="0.25">
    <path fill="url(#neon)" filter="url(#glow)" d="M52.8,-67C68,-61.6,79.7,-45.6,82.5,-28.7C85.4,-11.8,79.5,6,71.4,20.8C63.2,35.5,53,47.1,40.7,53.3C28.5,59.4,14.2,60,-2.1,63C-18.5,65.9,-37,71.2,-50.5,60.9C-64,50.7,-72.6,25.3,-73.3,-0.4C-74,-26.2,-66.8,-52.3,-49.9,-60.8C-33,-69.3,-16.5,-60.1,0.2,-60.3C16.9,-60.6,33.8,-70.2,52.8,-67Z">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M52.8,-67C68,-61.6,79.7,-45.6,82.5,-28.7C85.4,-11.8,79.5,6,71.4,20.8C63.2,35.5,53,47.1,40.7,53.3C28.5,59.4,14.2,60,-2.1,63C-18.5,65.9,-37,71.2,-50.5,60.9C-64,50.7,-72.6,25.3,-73.3,-0.4C-74,-26.2,-66.8,-52.3,-49.9,-60.8C-33,-69.3,-16.5,-60.1,0.2,-60.3C16.9,-60.6,33.8,-70.2,52.8,-67Z;M43.1,-58.1C56.8,-49.5,69.2,-38.1,72.9,-24.3C76.5,-10.5,71.4,5.7,63.4,18.3C55.4,30.9,44.5,39.9,32.4,47.1C20.3,54.2,7,59.4,-7.2,60.9C-21.4,62.4,-36.5,60.2,-49.4,51.7C-62.3,43.2,-73,28.5,-76.2,11.9C-79.4,-4.7,-75.1,-23.2,-64.4,-36.2C-53.6,-49.2,-36.4,-56.7,-20.3,-62C-4.1,-67.3,11.1,-70.4,25.2,-67C39.3,-63.7,52.3,-53.9,43.1,-58.1Z;M52.8,-67C68,-61.6,79.7,-45.6,82.5,-28.7C85.4,-11.8,79.5,6,71.4,20.8C63.2,35.5,53,47.1,40.7,53.3C28.5,59.4,14.2,60,-2.1,63C-18.5,65.9,-37,71.2,-50.5,60.9C-64,50.7,-72.6,25.3,-73.3,-0.4C-74,-26.2,-66.8,-52.3,-49.9,-60.8C-33,-69.3,-16.5,-60.1,0.2,-60.3C16.9,-60.6,33.8,-70.2,52.8,-67Z"/>
    </path>
  </g>
  
  <!-- Name: @LuciKritZ (centered) -->
  <text text-anchor="middle" alignment-baseline="middle" x="50%" y="45%" class="name">@LuciKritZ</text>
  
  <!-- Website (centered) -->
  <text text-anchor="middle" x="50%" y="62%" class="website">krishal-shah.in</text>
</svg>
